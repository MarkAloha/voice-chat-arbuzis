<section class="card">
    @if (error()) {
        <p class="error">{{ error() }}</p>
    }

    @if (step() === 'name') {
        <form (ngSubmit)="continueWithName()">
            <input
                id="nickname"
                type="text"
                name="nickname"
                [(ngModel)]="nickname"
                autocomplete="nickname"
                maxlength="32"
                placeholder="Имя"
                aria-label="Имя"
                [disabled]="loading()"
            />

            <button type="submit" class="submit">Продолжить</button>
        </form>
    } @else {
        <form (ngSubmit)="submit()">
            <input
                #passwordInput
                id="password"
                type="password"
                name="password"
                [(ngModel)]="password"
                autocomplete="current-password"
                placeholder="Пароль"
                aria-label="Пароль"
                [disabled]="loading()"
            />

            <button
                type="submit"
                class="submit"
                [class.submit--loading]="loading()"
                [class.submit--full]="roomFull()"
                [disabled]="loading() || roomFull()"
            >
                @if (loading()) {
                    Вход…
                } @else if (roomFull()) {
                    Комната заполнена
                } @else {
                    Войти в комнату
                }
            </button>
        </form>
    }
</section>
